<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inloggen — Weekzicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #F6F8FA; --surface: #FFFFFF; --ink: #30313D; --ink-2: #687385; --ink-3: #8792A2;
    --line: #E3E8EE; --accent: #635BFF; --accent-hover: #5147E8; --now: #DF1B41; --now-soft: #FFE7F2;
    --ring: 0 0 0 1px rgba(60, 66, 87, .16), 0 1px 1px 0 rgba(0, 0, 0, .06);
    --focus: 0 0 0 1px var(--accent), 0 0 0 4px rgba(99, 91, 255, .28);
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 15px 35px rgba(60, 66, 87, .10), 0 5px 15px rgba(0, 0, 0, .06); }
  header { display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
  .mark { width: 36px; height: 36px; display: grid; place-items: center; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .02em; border-radius: 9px; box-shadow: 0 1px 2px rgba(60, 66, 87, .25); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
  header span { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
  form { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  label { font-size: 13px; font-weight: 500; }
  input { width: 100%; margin-top: 6px; padding: 9px 12px; background: var(--surface); border: 0; border-radius: 6px; box-shadow: var(--ring); font: 14px var(--sans); color: var(--ink); }
  input:focus { outline: none; box-shadow: var(--focus); }
  button { width: 100%; height: 38px; padding: 0 14px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font: 600 14px var(--sans); cursor: pointer; box-shadow: 0 2px 5px rgba(60, 66, 87, .08), 0 1px 1px rgba(0, 0, 0, .06); }
  button:hover { background: var(--accent-hover); }
  .fout { display: none; padding: 10px 12px; background: var(--now-soft); border-radius: 6px; color: var(--now); font-size: 13px; font-weight: 500; }
  .fout.on { display: block; }
  p.note { margin: 0; padding: 0 24px 20px; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="mark">WZ</div>
    <div><h1>Weekzicht</h1><span>Alleen voor de planner</span></div>
  </header>
  <form method="post" action="/api/inloggen">
    <div class="fout" id="fout">Dat wachtwoord klopt niet. Probeer het nog eens.</div>
    <label for="w">Wachtwoord
      <input type="password" id="w" name="wachtwoord" autocomplete="current-password" autofocus required>
    </label>
    <div><button type="submit">Inloggen</button></div>
  </form>
  <p class="note">Klanten hoeven hier niet in te loggen: zij gebruiken de formulierlink die je ze stuurt.</p>
</div>
<script>
  if (/[?&]fout=1/.test(location.search)) document.getElementById("fout").className = "fout on";
</script>
</body>
</html>
